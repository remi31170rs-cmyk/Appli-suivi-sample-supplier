services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sample_supplier
      POSTGRES_USER: sample_app
      POSTGRES_PASSWORD: sample_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample_app -d sample_supplier"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
